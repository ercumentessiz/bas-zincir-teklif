name: APK Derle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: google-services.json kontrolü
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "HATA: app/google-services.json bulunamadi. Firebase konsolundan indirip repo icine eklemelisiniz."
            exit 1
          fi

      - name: APK derle (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yi yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BasZincirTeklif-apk
          path: app/build/outputs/apk/debug/app-debug.apk
